name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint, build and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Node 22 for node:sqlite, which stands in for Cloudflare D1 in the tests.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Only the browser, from Playwright's own download servers. The system libraries it needs
      # are already on GitHub's runners (they ship Google Chrome), so there's no apt-get step to
      # depend on Ubuntu's package mirrors. Cached per Playwright version.
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install chromium
      - run: npm run lint
      - run: npm run build
      - run: npm run test:e2e

      - name: Keep screenshots and app logs from a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/e2e/.output/
          include-hidden-files: true
          retention-days: 7
